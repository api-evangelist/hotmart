aid: hotmart
name: Hotmart
description: >-
  Hotmart is a Brazilian creator-economy platform for producing, selling and delivering digital
  products — online courses, ebooks, mentorships, paid communities, events and, more recently,
  physical products. It bundles a hosted checkout, a marketplace, an affiliate network, a
  members-area LMS (Hotmart Club) and payment processing as merchant of record (HotPay), and sells
  into more than 180 countries. Hotmart Developers is the public REST API over that platform: OAuth
  2.0 client-credentials authentication, product-area path prefixes (/payments, /club, /products,
  /physicalproducts, /events, /accounts, /user), cursor pagination, a sparse-fieldset `select`
  parameter, a 500-request-per-minute rate limit, a full-parity sandbox host, and a per-product
  webhook (postback) event surface carrying purchase, subscription, members-area and logistics
  events on two independently versioned payload schemas. Hotmart publishes no OpenAPI, no SDK and
  no CLI — the contract an integrator works from is prose documentation plus per-endpoint cURL,
  Node and Java request samples.
