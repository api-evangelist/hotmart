apis:
- name: Hotmart Authentication (OAuth 2.0)
  description: >-
    The Hotmart authorization server. Exchanges a developer credential
    (client_id/client_secret, presented with HTTP Basic) for a short-lived OAuth 2.0
    client_credentials access token, which is then sent as a Bearer token on every Hotmart
    Developers request. Credentials are minted in the Hotmart platform under Tools > Developer
    Credentials and are bound at creation time to either production or sandbox.
  humanURL: https://developers.hotmart.com/docs/en/start/app-auth/
  baseURL: https://api-sec-vlc.hotmart.com/security/oauth
  tags:
  - Authentication
  tags_raw:
  - Authentication
  - OAuth
  properties:
  - type: Documentation
    url: https://developers.hotmart.com/docs/en/start/app-auth/
  - type: Authentication
    url: authentication/hotmart-authentication.yml
- name: Hotmart Subscriptions API
  description: >-
    Read and manage recurring subscriptions on a Hotmart product — list subscribers with status,
    plan and date filters, pull a subscriber's purchase history, list subscription transactions
    and summaries, cancel and reactivate individually or in bulk, switch plans, and change the
    next charge date.
  humanURL: https://developers.hotmart.com/docs/en/v1/subscription/get-subscribers/
  baseURL: https://developers.hotmart.com/payments/api/v1/subscriptions
  tags:
  - Subscription
  - Payments
  - Recurring Billing
  tags_raw:
  - Subscriptions
  - Payments
  - Recurring Billing
  properties:
  - type: Documentation
    url: https://developers.hotmart.com/docs/en/v1/subscription/get-subscribers/
- name: Hotmart Sales API
  description: >-
    Sales reporting and post-sale actions for a Hotmart producer — sales history, sales summary,
    per-transaction price breakdown, commission split across producer, co-producer and affiliate,
    buyer records, plus refunding a transaction and re-generating a bank payment slip (boleto).
  humanURL: https://developers.hotmart.com/docs/en/v1/sales/about-sales/
  baseURL: https://developers.hotmart.com/payments/api/v1/sales
  tags:
  - Sales
  - Payments
  - Commissions
  - Reporting
  properties:
  - type: Documentation
    url: https://developers.hotmart.com/docs/en/v1/sales/about-sales/
- name: Hotmart Payment Link API
  description: >-
    Create and list Hotmart payment links, attach additional offers and plans to a link, and
    charge a saved payment token by offer or by arbitrary value — the programmatic equivalent of
    Hotmart's hosted checkout link.
  humanURL: https://developers.hotmart.com/docs/en/v1/payment-link/about-pl/
  baseURL: https://developers.hotmart.com/payments/api/v1/link
  tags:
  - Payments
  - Checkout
  - Payment Links
  properties:
  - type: Documentation
    url: https://developers.hotmart.com/docs/en/v1/payment-link/about-pl/
- name: Hotmart Products API
  description: >-
    The product catalog surface — list products, read a product's offers and plans by ucode,
    update product configuration, and create, read and delete discount coupons for a product.
  humanURL: https://developers.hotmart.com/docs/en/v1/product/product-list/
  baseURL: https://developers.hotmart.com/products/api/v1
  tags:
  - Product
  - Catalog
  - Coupons
  - Offers
  tags_raw:
  - Products
  - Catalog
  - Coupons
  - Offers
  properties:
  - type: Documentation
    url: https://developers.hotmart.com/docs/en/v1/product/product-list/
- name: Hotmart Club (Members Area) API
  description: >-
    The members-area / LMS surface. Lists Club modules and pages for a subdomain, lists enrolled
    users, and reads a user's lesson-by-lesson progress — the content-consumption side of a
    Hotmart product, distinct from the commerce side.
  humanURL: https://developers.hotmart.com/docs/en/v1/club/about-club/
  baseURL: https://developers.hotmart.com/club/api/v1
  tags:
  - Learning Management
  - Members Area
  - Content
  - Progress Tracking
  properties:
  - type: Documentation
    url: https://developers.hotmart.com/docs/en/v1/club/about-club/
- name: Hotmart Physical Products API
  description: >-
    The logistics/fulfillment partner surface for physical products sold through Hotmart. Manages
    partner credentials, creates and updates products and variants, posts shipment status and
    tracking updates, and registers partner-side webhooks. A v2 product endpoint ships alongside
    v1.
  humanURL: https://developers.hotmart.com/docs/en/v1/physical-product/pp-webhook-create/
  baseURL: https://developers.hotmart.com/physicalproducts/api/v1
  tags:
  - Physical Products
  - Logistics
  - Fulfillment
  - Shipping
  properties:
  - type: Documentation
    url: https://developers.hotmart.com/docs/en/v1/physical-product/pp-webhook-create/
- name: Hotmart Events, Account and User API
  description: >-
    The smaller documented surfaces — event ticket information and participant lists
    (/events/api/v1), account information (/accounts/api/v1/info), the authenticated user profile
    (/user/api/v1/me), and installment negotiation (/payments/api/v1/installments/negotiate).
  humanURL: https://developers.hotmart.com/docs/en/
  baseURL: https://developers.hotmart.com/events/api/v1
  tags:
  - Event
  - Tickets
  - Account
  - User Profile
  tags_raw:
  - Events
  - Tickets
  - Accounts
  - User Profile
  properties:
  - type: Documentation
    url: https://developers.hotmart.com/docs/en/
