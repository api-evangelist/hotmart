description: >-
  Which cross-cutting and industry standards the Hotmart Developers API
  conforms to, assessed against what Hotmart publishes. Hotmart is a Brazilian
  creator-economy and digital-products platform that also acts as merchant of
  record, so payment and Brazilian data-protection regimes are the relevant
  regulatory frame — but Hotmart publishes no compliance attestations on its
  developer surface.
