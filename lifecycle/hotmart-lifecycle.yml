  versioning and lifecycle posture read from Hotmart's own developer surface.
versioning:
  scheme: uri-path
  current: v1
  also_shipping:
    - v2 (partial) — /club/api/v2/modules/{module_id}/pages
    - v2 (partial) — /physicalproducts/api/v2/product
  mechanism: >-
    The major version is a path segment after the product prefix, e.g.
    /payments/api/v1/subscriptions. Versions are introduced per-surface, not
    across the whole API at once; v1 and v2 of the same resource coexist and are
    documented side by side with a version swapper in the docs.
  event_versioning:
    scheme: event-schema version
    versions: ['1.0.0', '2.0.0']
    mechanism: >-
      Webhook payload version is chosen when the webhook configuration is
      created and echoed in the `version` field of every delivery. 2.0.0 is
      where all new fields have landed since 2022; 1.0.0 remains documented.
  docs: https://developers.hotmart.com/docs/en/changelog
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  notes: >-
    Hotmart publishes no deprecation policy, no notice period, and no RFC 8594
    Sunset/Deprecation header support. The changelog is additive — of the 83
    published entries, 60 are "Added", 17 "Changed", 5 "Fixed" and 1 "Security";
    none announces a removal or a breaking change. Older surfaces (webhook 1.0.0, club pages v1, physical product v1)
    are left in place alongside their successors rather than sunset. An
    integrator has no published signal for when an older version will stop
    working.
