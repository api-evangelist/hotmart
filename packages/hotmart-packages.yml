method: searched
source: >-
  npm registry search (npmjs.org), PyPI, Packagist, GitHub (Hotmart-Org), and
  https://developers.hotmart.com/docs/en/ — searched for first-party client
  libraries for the Hotmart Developers API.
description: >-
  Hotmart ships NO official SDK or client library for the Hotmart Developers
  REST API in any language. The docs publish per-endpoint request samples in
  cURL, Node and Java (see examples/hotmart-code-samples.yml) and stop there.
  The first-party packages that do exist on npm under the @hotmart scope are
  front-end/platform integration helpers, not API clients. Every library that
  wraps the Developers API is third-party.
official_api_sdk: false
packages:
  # --- First-party (published by Hotmart, but not API SDKs) ---
  - language: javascript
    registry: npm
    name: '@hotmart/hot-login'
    url: https://www.npmjs.com/package/@hotmart/hot-login
    install: npm install @hotmart/hot-login
    official: true
    scope: sso
    description: >-
      Helper package for integrating with Hotmart's SSO. Front-end auth
      integration, not a client for the Developers REST API.
  - language: javascript
    registry: npm
    name: eslint-config-hotmart
    url: https://www.npmjs.com/package/eslint-config-hotmart
    install: npm install --save-dev eslint-config-hotmart
    official: true
    scope: tooling
    description: Hotmart's own JavaScript style / ESLint configuration. Internal engineering tooling.
  - language: javascript
    registry: cdn
    name: hotmart-checkout-elements.js
    url: https://checkout.hotmart.com/lib/hotmart-checkout-elements.js
    install: '<script src="https://checkout.hotmart.com/lib/hotmart-checkout-elements.js"></script>'
    official: true
    scope: embedded-checkout
    description: >-
      Loader for Hotmart Checkout Elements (overlay and embedded checkout). CDN
      script, not published to a package registry. See
      components/hotmart-components.yml.
  # --- Third-party (community; listed for accuracy, not credited to Hotmart) ---
  - language: javascript
    registry: npm
    name: hotmart-sdk
    url: https://www.npmjs.com/package/hotmart-sdk
    official: false
    scope: api-client
    description: Community SDK covering membership areas, subscriptions and related endpoints.
